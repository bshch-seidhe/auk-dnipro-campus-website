<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Class schedule</title>

        <script src="https://telegram.org/js/telegram-web-app.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="hero">
            <div class="hero-top">
                <span class="pill">
                    <i>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                             stroke="#0F2460" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="16" rx="3"/>
                            <path d="M3 10h18M8 3v4M16 3v4"/>
                        </svg>
                    </i>
                    AUK Dnipro Campus
                </span>

                <label class="group">
                    <select id="group" aria-label="Group"></select>
                    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
                        <path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </label>
            </div>

            <h1>Class schedule</h1>
            <p class="status" id="status" aria-live="polite"></p>
            <nav class="days" id="days" role="tablist" aria-label="Day of week"></nav>
        </header>

        <main>
            <section class="card" id="list" aria-live="polite"></section>
            <footer id="updated"></footer>
        </main>

        <script src="app.js" defer></script>
    </body>
</html>
